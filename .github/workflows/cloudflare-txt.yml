name: Configure Google verification TXT

on:
  workflow_dispatch:
    inputs:
      token:
        description: Google site verification token without the prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Create Google verification TXT through Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: manifest.dpdns.org
          CLOUDFLARE_RECORD_NAME: manifest.dpdns.org
          CLOUDFLARE_TXT_CONTENT: "google-site-verification=${{ inputs.token }}"
        run: node scripts/cloudflare-dns.mjs --txt --apply

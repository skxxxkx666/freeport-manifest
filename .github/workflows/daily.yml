name: Daily manifest

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC === 次日 04:00 UTC+8
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gen.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 拉取节点并生成今日运单
        id: gen
        env:
          SOURCES: ${{ secrets.SUB_SOURCES }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node scripts/issue-manifest.mjs

      - name: 提交
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name  "manifest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/subs public/free
          git commit -m "issue: $(date -u -d '+8 hours' +%Y-%m-%d) manifest"
          git push

  deploy:
    needs: issue
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

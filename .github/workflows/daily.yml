name: Daily manifest

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC === 次日 04:00 UTC+8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-manifest
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: 安装固定版本的 Mihomo
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output .tools/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-compatible-v1.19.29.gz
          echo "5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094  .tools/mihomo.gz" | sha256sum --check
          gzip --decompress --stdout .tools/mihomo.gz > .tools/mihomo
          chmod +x .tools/mihomo
          echo "MIHOMO_BIN=$PWD/.tools/mihomo" >> "$GITHUB_ENV"

      - name: 拉取、实测并生成今日运单
        id: gen
        env:
          SOURCES: ${{ secrets.SUB_SOURCES }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          REQUIRE_HEALTH_CHECK: "true"
          HEALTH_MIN_NODES: "5"
          HEALTH_MIN_RATIO: "0.2"
        run: node scripts/issue-manifest.mjs

      - name: 提交
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "manifest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/subs public/free
          git commit -m "issue: $(date -u -d '+8 hours' +%Y-%m-%d) manifest"
          git push

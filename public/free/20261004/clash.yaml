    path: ./ruleset/icloud.yaml
    interval: 86400
    size-limit: 10000000
  apple:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
    path: ./ruleset/apple.yaml
    interval: 86400
    size-limit: 10000000
  google:
    type: http
    behavior: domain

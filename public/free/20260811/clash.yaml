    - DOMAIN-SUFFIX,local,real-ip
    - MATCH,fake-ip
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:

    - DOMAIN-SUFFIX,local,real-ip
    - MATCH,fake-ip
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:private:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    rule-set:direct:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    rule-set:proxy:
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
